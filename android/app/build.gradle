plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'ru.asd.commgames'
    compileSdk 34

    defaultConfig {
        applicationId "ru.asd.commgames"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    // Подпись release-сборки. Файл keystore.properties не попадает в репозиторий,
    // поэтому если его нет — release собирается без подписи (только для проверки).
    def keystorePropsFile = rootProject.file("keystore.properties")
    if (keystorePropsFile.exists()) {
        def keystoreProps = new Properties()
        keystorePropsFile.withInputStream { keystoreProps.load(it) }
        signingConfigs {
            release {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystorePropsFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        buildConfig true
    }

    // lintVital при сборке release пытается скачать проверки из сети и на медленном
    // соединении надолго зависает. Для сборки APK проверка не нужна — отключаем.
    // (Отдельно можно запустить: ./gradlew lint)
    lint {
        checkReleaseBuilds false
    }

    // Веб-часть (index.html, js, css, assets) лежит в app/src/main/assets/www
    // и копируется туда скриптом ../tools/copy-web.sh
    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets']
        }
    }

    packaging {
        resources {
            excludes += ['META-INF/*.kotlin_module']
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.core:core-ktx:1.13.1'
}
