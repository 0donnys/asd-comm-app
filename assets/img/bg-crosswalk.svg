  <path d="M0 32h210" stroke="#24544F" stroke-width="5"/>
  <rect x="32" y="54" width="36" height="30" rx="3" fill="url(#sky)"/>
  <rect x="142" y="54" width="36" height="30" rx="3" fill="url(#sky)"/>
