</g>
<!-- светофор на тротуаре -->
<g transform="translate(690,190)">
  <rect x="14" y="0" width="12" height="150" rx="5" fill="#4A342A"/>
  <rect x="-16" y="-6" width="72" height="104" rx="10" fill="#4A342A"/>
