<rect y="432" width="800" height="18" fill="#C9B695" stroke="none"/>
<path d="M0 432h800" stroke="#8B7458" stroke-width="4"/>
<path d="M0 410h800" stroke="#7A7368" stroke-width="2" opacity=".4"/>
</g>
</svg>
